[package]
name = "shikigami"
version = "0.8.0"
edition = "2024"
description = "Terminal UI for Jujutsu (jj): browse the change graph, read diffs, and drive new/edit/describe/squash/rebase/abandon without leaving the log"
license = "MIT"
repository = "https://github.com/yukimemi/shikigami"
homepage = "https://github.com/yukimemi/shikigami"
readme = "README.md"
keywords = ["jujutsu", "jj", "tui", "vcs", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
anyhow = "1.0.104"

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["events"] }
# `jj diff --color always` の ANSI をそのまま ratatui の Text に変換するため。
# diff の色付けを自前で実装すると jj 側の設定 (ui.diff-formatter, color
# theme, word-level diff) を全部無視することになる。jj に色を付けさせて
# 変換するだけなら、user の `~/.config/jj/config.toml` がそのまま効く
# (`Jj::diff` は `--git` を強制しないので `ui.diff-formatter` に外部ツール
# を設定していればそれも通る)。任意で `SHIKIGAMI_DIFF_FILTER`
# (`src/diff_filter.rs`) がこの ANSI を delta のような外部ページャに
# もう一段通せるが、shikigami 自身は依然として diff を一切再解釈しない。
ansi-to-tui = "8.0.1"

# jj の呼び出しは同期 std::process::Command で足りる (renri の JjBackend と
# 同じ方針)。TUI 本体は 1 イベントループ 1 スレッドで、選択変更のたびの
# `jj diff` は同期のまま。唯一の例外が起動時の `jj log`/`jj status`
# (`App::begin_reload`): これだけは std::thread + mpsc で back
# ground に逃がす — Windows は `CreateProcess` が重く、それをブロッキング
# で待つと alternate screen に入るまで固まって見えるため。tokio は
# 持ち込まない (1 回きりの fire-and-forget に runtime は要らない)。

# Self-update (`shikigami self-update`) は kaishin 経由。TUI 実行時には
# tokio ランタイムを一切立てない: src/update.rs がサブコマンド専用に
# current_thread ランタイムをその場で組み立てて畳むだけで、renri の
# Checker のようなバックグラウンド自動更新/banner は持ち込まない
# (alternate screen 上の TUI に印字する隙間がない)。kaishin 自体が
# tokio を "full" feature で要求するので、ここでの feature 指定は
# 実質ドキュメント目的 (Builder::new_current_thread / block_on にしか
# 使わない)。
kaishin = "0.7.5"
tokio = { version = "1.53.1", features = ["rt"] }

# commit ごとの `jj diff`/`jj show` 結果をディスクへ永続化するキャッシュ
# (`src/cache.rs`) 用。jj の commit_id は content-addressed なので、一度
# 取れた出力はプロセスをまたいでも安全に使い回せる — 次回起動時、選択中の
# commit がキャッシュに載っていれば `jj diff`/`jj show` を叩かずに初回描画
# できる。serde/serde_json は保存形式、dirs は OS ごとのキャッシュ
# ディレクトリ解決に使う。
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"

# Windows のみ: `cmd /C` 越しに `SHIKIGAMI_AI_CMD`/`SHIKIGAMI_DIFF_FILTER`
# を呼んだとき、cmd.exe 自身が出すローカライズ済みエラー (プログラムが
# 見つからない等) はシステムの OEM コードページで書かれ、UTF-8 ではない。
# `src/decode.rs` がその場合だけ `MultiByteToWideChar` で読み直す
# (詳細は同ファイルのコメント参照)。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3.27"
